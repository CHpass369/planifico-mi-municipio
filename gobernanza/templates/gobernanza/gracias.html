<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuestionario guardado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ecfdf5, #f8fafc);
      color: #0f172a;
      display: grid;
      min-height: 100vh;
      place-items: center;
    }

    .card {
      width: min(640px, calc(100% - 28px));
      background: #fff;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.10);
      border: 1px solid #d9e2dc;
      text-align: center;
    }

    h1 {
      color: #064e3b;
      margin-top: 0;
    }

    .score {
      font-size: 34px;
      font-weight: 950;
      color: #0f7a3b;
      margin: 16px 0;
    }

    a {
      display: inline-flex;
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 999px;
      background: #0f7a3b;
      color: #fff;
      text-decoration: none;
      font-weight: 900;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Cuestionario registrado correctamente</h1>
    <p>La información fue guardada para el análisis de gobernanza institucional.</p>

    {% if puntaje %}
      <div class="score">{{ puntaje }} / 50</div>
      <p>Nivel de gobernanza: <strong>{{ nivel }}</strong></p>
    {% endif %}

    <a href="/gobernanza/">Registrar otro cuestionario</a>
    <a href="/" style="background:#334155; margin-left:8px;">Volver al inicio</a>
  </div>
</body>
</html>
